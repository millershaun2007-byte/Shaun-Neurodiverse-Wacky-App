<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Literacy Test</title>
    <style>
        body { font-family: 'Poppins', 'Comic Sans MS', Arial, sans-serif; background: #f8fafc; padding: 32px; }
        #literacy {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 22px;
            max-width: 900px;
            margin: 0 auto 32px auto;
        }
        .activity-btn {
            background: linear-gradient(135deg, #FFD700 60%, #9370DB 100%);
            color: #fff;
            border: none;
            border-radius: 16px;
            font-size: 1.15em;
            font-family: 'Poppins', 'Comic Sans MS', Arial, sans-serif;
            font-weight: 700;
            padding: 22px 0;
            box-shadow: 0 2px 8px rgba(147,112,219,0.10);
            cursor: pointer;
            transition: background 0.18s, transform 0.18s;
            outline: none;
            width: 100%;
            min-height: 70px;
        }
        .activity-btn:hover, .activity-btn.active {
            background: linear-gradient(135deg, #9370DB 60%, #FFD700 100%);
            color: #fff;
            transform: scale(1.04);
            box-shadow: 0 4px 16px rgba(147,112,219,0.18);
        }
        #literacyActivity {
            margin-top: 32px;
            border: none;
            background: #fff;
            border-radius: 24px;
            box-shadow: 0 4px 24px rgba(147,112,219,0.10);
            padding: 36px 24px 36px 24px;
            min-height: 320px;
        }
        .letter-btn, .word-btn {
            padding: 20px;
            margin: 10px;
            font-size: 24px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1 style="text-align:center; color:#764ba2; font-family:'Poppins','Comic Sans MS',Arial,sans-serif; font-size:2.2em; margin-bottom:18px;">Literacy Activities Playground</h1>
    
    <div id="literacy">
        <button class="activity-btn" data-activity="letters">Letters</button>
        <button class="activity-btn" data-activity="phonics">Phonics</button>
        <button class="activity-btn" data-activity="spelling">Spelling</button>
        <button class="activity-btn" data-activity="vocabulary">Vocabulary</button>
        <button class="activity-btn" data-activity="sight-words">Sight Words</button>
        <button class="activity-btn" data-activity="sentences">Sentences</button>
        <button class="activity-btn" data-activity="rhyming">Rhyming</button>
        <button class="activity-btn" data-activity="reading">Reading</button>
        <button class="activity-btn" data-activity="story-builder">Story Builder</button>
        <button class="activity-btn" data-activity="word-builder">Word Builder</button>
    </div>
    
    <div id="literacyActivity">
        <p>Click a button above</p>
    </div>
    

    <div style="max-width:400px;margin:32px auto 0 auto;text-align:center;">
        <div id="literacyStars" style="font-size:2em;color:#FFD700;font-weight:bold;margin-bottom:8px;text-shadow:0 2px 8px #9370DB44;">0</div>
        <div id="literacyProgress" style="width: 0%; height: 22px; background: linear-gradient(90deg, #FFD700 0%, #9370DB 100%); border-radius:12px; margin-bottom:18px; transition: width 0.4s cubic-bezier(.4,2,.6,1);"></div>
    </div>

    <script src="js/literacy-activities.js"></script>
</body>
</html>
